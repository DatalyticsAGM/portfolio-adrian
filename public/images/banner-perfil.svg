<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-label="Adrián Gallardo Muñoz — Data Analyst y Business Intelligence, Alicante, España">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#1e3a5f"/>
      <stop offset="62%"  stop-color="#1b3354"/>
      <stop offset="100%" stop-color="#162b46"/>
    </linearGradient>
    <pattern id="rejilla" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#ffffff" opacity="0.07"/>
    </pattern>
    <linearGradient id="desvanece" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#1e3a5f" stop-opacity="0"/>
      <stop offset="100%" stop-color="#1e3a5f" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="280" fill="url(#fondo)"/>
  <rect width="1200" height="280" fill="url(#rejilla)"/>

  <!-- Motivo decorativo: barras escalonadas, puramente ornamental -->
  <g opacity="0.16" fill="#60a5fa">
    <rect x="880"  y="196" width="26" height="46"  rx="3"/>
    <rect x="922"  y="168" width="26" height="74"  rx="3"/>
    <rect x="964"  y="124" width="26" height="118" rx="3"/>
    <rect x="1006" y="150" width="26" height="92"  rx="3"/>
    <rect x="1048" y="88"  width="26" height="154" rx="3"/>
    <rect x="1090" y="112" width="26" height="130" rx="3"/>
    <rect x="1132" y="62"  width="26" height="180" rx="3"/>
  </g>
  <rect x="820" y="0" width="380" height="280" fill="url(#desvanece)" opacity="0.55"/>

  <!-- Filete lateral -->
  <rect x="72" y="86" width="4" height="108" rx="2" fill="#2563eb"/>

  <text x="104" y="130"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="42" font-weight="700" letter-spacing="3" fill="#ffffff">ADRIÁN GALLARDO MUÑOZ</text>

  <text x="106" y="172"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="20" font-weight="600" letter-spacing="4.2" fill="#93b4e8">DATA ANALYST · BUSINESS INTELLIGENCE</text>

  <text x="106" y="204"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="15" font-weight="400" letter-spacing="1.4" fill="#ffffff" opacity="0.52">Alicante, España</text>

  <rect x="0" y="274" width="1200" height="6" fill="#2563eb"/>
</svg>
